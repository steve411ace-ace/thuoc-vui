name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: build-apk
  cancel-in-progress: true


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - run: flutter pub get
      - name: Restore Gradle wrapper and launcher icons
        run: |
          flutter create --template=app --org com.thuocvui --project-name thuoc_vui /tmp/tpl
          cp /tmp/tpl/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          cp -r /tmp/tpl/android/app/src/main/res/mipmap-* android/app/src/main/res/
          chmod +x android/gradlew
      - name: Restore custom Thuoc Vui launcher icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            base64 -d android/app/icon_base64/ic_launcher_$d.base64 > android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Thuoc Vui v1.0.0"
          files: build/app/outputs/flutter-apk/app-release.apk
