name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: build-apk
  cancel-in-progress: true


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - run: flutter pub get
      - name: Restore Gradle wrapper and launcher icons
        run: |
          flutter create --template=app --org com.thuocvui --project-name thuoc_vui /tmp/tpl
          cp /tmp/tpl/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          cp -r /tmp/tpl/android/app/src/main/res/mipmap-* android/app/src/main/res/
          chmod +x android/gradlew
      - name: Restore custom Thuoc Vui launcher icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            base64 -d android/app/icon_base64/ic_launcher_$d.base64 > android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Read app version
        id: app_version
        run: |
          VERSION=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not parse version from pubspec.yaml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "Thuoc Vui v$VERSION"
            echo
            git log -1 --pretty=%B
          } > /tmp/release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: Thuoc Vui v${{ steps.app_version.outputs.version }}
          body_path: /tmp/release-notes.md
          files: build/app/outputs/flutter-apk/app-release.apk
          # Same version rebuild: update existing release/tag instead of failing
          overwrite_files: true
      - name: Upload to Firebase App Distribution
        uses: wzieba/firebase-distribution-github-action@v1
        with:
          appId: 1:443475386602:android:24a4cd7b7e54d67a293793
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: build/app/outputs/flutter-apk/app-release.apk
          testers: steve411ace@gmail.com
