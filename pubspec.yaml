name: thuoc_vui
description: "Thuốc Vui - Nhắc nhở lịch uống thuốc hàng ngày, phong cách hoạt hình vui nhộn."
publish_to: "none"
version: 1.2.20+23

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  flutter_timezone: ^4.1.0
  # 0.7.0 pinned, NOT 0.9.x: 0.9.2+1 pulls Kotlin 2.1 metadata
  # (kotlin-stdlib 2.1.20, coroutines 1.10.2, work 2.11.2) which the
  # project's Kotlin 1.8 compiler cannot read. 0.7.0 uses Kotlin 1.9,
  # Glance 1.0.0 and compileSdk 34, matching the Flutter 3.24 stack.
  home_widget: 0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
